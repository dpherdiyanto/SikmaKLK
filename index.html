<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Fix for browser extensions attempting to assign window.fetch when it only has a getter
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(val) {
              _origFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}

        // Filter out uncaught third-party browser extension errors
        window.addEventListener('error', function(event) {
          if (event && event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
